<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (function () {
        var shortlink = document.querySelector('meta[name="shortlink-target"]');
        var target = shortlink && shortlink.getAttribute('content');
        if (target) {
          window.location.replace(target);
          return;
        }

        function pickRandom() {
          var el = document.getElementById('hitokoto');
          if (!el) return;

          fetch('%sveltekit.assets%/data/sao.json')
            .then(function (r) { return r.json(); })
            .then(function (arr) {
              if (Array.isArray(arr) && arr.length) {
                el.textContent = arr[Math.floor(Math.random() * arr.length)];
              }
            })
            .catch(function () {});
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', pickRandom);
        } else {
          pickRandom();
        }
      })();
    </script>
  </body>
</html>
